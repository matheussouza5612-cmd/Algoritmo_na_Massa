<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receber Pedidos</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div id="header-dinamico"></div>
    <script>
        // Busca o arquivo header.html separado e insere na div acima
        fetch('header.html')
          .then(response => response.text())
          .then(data => {
            document.getElementById('header-dinamico').innerHTML = data;
          })
          .catch(error => console.error('Erro ao carregar o cabeçalho:', error));
      </script>
      
    <button id="addPedidoTeste">Adicionar pedido teste</button>
    
    <div class="backgroundDosPedido" id="backgroundDosPedidos">
        <div class="pedido" id="">
            <div class="cliente">
                <img src="imagens/Logo.png" alt="imagem de teste">
                <h4>Nome</h4>
            </div>
            <button>receber pedido</button>
            
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>

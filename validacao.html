<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="validacao.css">
</head>

<body>
    <div class="container">
        <h1 class="titulo">VALIDAÇÃO DA LÓGICA</h1>
        <div class="fundo">
            <div class="blocos">
                <div class="certo">
                    <i class="fa-solid fa-check" style="font-size: 60px; color: green;"></i>
                    <p>Ingredientes (X/X)</p>
                    <p>Tempo de Forno</p>
                </div>

                <div class="errado">
                    <i class="fa-solid fa-x" style="font-size: 50px; color: red;"></i>
                    <p>Ingredientes (X/X)</p>
                    <p>Tempo de Forno</p>
                </div>
            </div>

            <div class="botoes">
                <a href="" class="retry">TENTAR DE NOVO</a>
                <a href="" class="continue">ASSAR MESMO <br> ASSIM</a>
            </div>
        </div>
    </div>

</body>

</html>

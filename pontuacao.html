<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" type="image/img" href="imagens/Logo.png">
    <link rel="stylesheet" href="pontuacao.css">

<body>
    <div class="container">
        <div class="lado"></div>

        <div class="meio">
            <div class="blocoTop">
                <h1 class="margin-0">PONTUAÇÃO FINAL</h1>

                <div class="lista">
                    <div class="linha">
                        <div>
                            <p class="margin-0">Construção do algoritmo:</p>
                            <p class="margin-0">detalhes</p>
                        </div>
                        <div>
                            <p class="margin-0">Xpts</p>
                        </div>
                    </div>

                    <hr class="ponto">

                    <div class="linha">
                        <div>
                            <p class="margin-0">Seleção de ingredientes:</p>
                            <p class="margin-0">detalhes</p>
                        </div>
                        <div>
                            <p class="margin-0">Xpts</p>
                        </div>
                    </div>

                    <hr class="ponto">

                    <div class="linha">
                        <div>
                            <p class="margin-0">Tempo de forno:</p>

                        </div>

                            <p class="margin-0">Xpts</p>
                        </div>
                    </div>

                    <hr class="ponto">

                    <div class="linha">
                        <div>
                            <p class="margin-0">Tempo de atendimento:</p>
                            <p class="margin-0">detalhes</p>
                        </div>
                        <div>
                            <p class="margin-0">Xpts</p>
                        </div>
                    </div>

                </div>
            </div>
            <div class="blocoBot">
                <div class="total">
                    <div>
                        <h2 class="margin-0">Total: X/X Pontos</h2>

                    </div>

            </div>
        </div>

        <div class="lado">
            <a href="" class="continue">CONTINUAR</a>
        </div>
    </div>

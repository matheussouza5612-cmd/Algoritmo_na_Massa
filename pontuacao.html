<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontuação | Algoritmo na Massa</title>
    <link rel="icon" type="image/img" href="imagens/Logo.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="paginaPontuacao">
    <div class="container">
        <div class="lado"></div>

        <div class="meio">
            <div class="blocoTop">
                <h1 class="margin-0" id="tituloPontuacao">PONTUAÇÃO FINAL</h1>
                <p class="subtituloPontuacao" id="subtituloPontuacao"></p>

                <div class="lista">
                    <div class="linha">
                        <div>
                            <p class="margin-0">Construção do algoritmo:</p>
                            <p class="margin-0" id="detalheAlgoritmo">detalhes</p>
                        </div>
                        <div>
                            <p class="margin-0" id="pontosAlgoritmo">0 pts</p>
                        </div>
                    </div>

                    <hr class="ponto">

                    <div class="linha">
                        <div>
                            <p class="margin-0">Seleção de ingredientes:</p>
                            <p class="margin-0" id="detalheIngredientes">detalhes</p>
                        </div>
                        <div>
                            <p class="margin-0" id="pontosIngredientes">0 pts</p>
                        </div>
                    </div>

                    <hr class="ponto">

                    <div class="linha">
                        <div>
                            <p class="margin-0">Tempo de forno:</p>
                            <p class="margin-0" id="detalheForno">detalhes</p>
                        </div>
                        <div>
                            <p class="margin-0" id="pontosForno">0 pts</p>
                        </div>
                    </div>

                    <hr class="ponto">

                    <div class="linha">
                        <div>
                            <p class="margin-0">Tempo de atendimento:</p>
                            <p class="margin-0" id="detalheAtendimento">detalhes</p>
                        </div>
                        <div>
                            <p class="margin-0" id="pontosAtendimento">0 pts</p>
                        </div>
                    </div>

                </div>
            </div>
            <div class="blocoBot">
                <div class="total">
                    <div>
                        <h2 class="margin-0" id="totalPontos">Total: 0/100 Pontos</h2>
                        <p class="margin-0" id="desempenhoPontos">DESEMPENHO: </p>
                    </div>
                </div>
            </div>
            <!-- <div class="conquistasPontuacao" id="conquistasPontuacao"></div> -->
            <div class="historicoPontuacao" id="historicoPontuacao"></div>
        </div>

        <div class="lado">
            <a href="pedidos.html" class="continue" id="proximaTela">CONTINUAR</a>
        </div>
    </div>












<script src="script.js"></script>
</body>

</html>

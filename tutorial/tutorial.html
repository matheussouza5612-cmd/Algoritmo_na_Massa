<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial</title>
    <style>
        body {
    margin: 0;
    min-height: 100vh;
    background-image: url("../imagens/fundo.webp");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.tela-inicial {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.logo {
    width: 500px;
    height: auto;
    display: block;
}

.botoes-menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-top: 40px;
}

.btn {
    width: 320px;
    height: 90px;
    padding: 15px 20px;
    color: white;
    background-color: #ca1726;
    border: 4px solid rgb(116, 15, 15);
    border-radius: 18px;
    font-size: 35px;
    font-family: fantasy;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0, 0, 0, 0.25);
    transition: all 0.2s ease;
    text-shadow:
        2px 2px 0 #8B1E1E,
        -2px -2px 0 #8B1E1E,
        2px -2px 0 #8B1E1E,
        -2px 2px 0 #8B1E1E;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 12px rgba(0, 0, 0, 0.25);
}

.btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
}
    </style>
</head>
<body>
    <!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="inicial_styles.css">
</head>

<body>

    <div class="tela-inicial">

        <div class="cabecalho">
            <img src="../imagens/Logo.png" alt="">
        </div>

        <div class="botoes-menu">
            <button class="btn btn-iniciar"><a href="niveis.html">JOGAR</a></button>
            <button class="btn btn-tutorial"><a href="tutorial.html"></a>TUTORIAL</button>
        </div>

    </div>

</body>

</html>
</body>
</html>

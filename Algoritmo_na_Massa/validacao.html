<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação | Algoritmo na Massa</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="paginaValidacao">
    <div class="container">
        <h1 class="titulo">VALIDAÇÃO DA LÓGICA</h1>
        <p id="resumoValidacao" class="resumoValidacao" aria-live="polite"></p>
        <div class="fundo">
            <div class="blocos">
                <div class="certo" id="validacaoCorreta">
                    <span class="iconeValidacao" aria-hidden="true">✓</span>
                    <p>Ingredientes (X/X)</p>
                    <p>Tempo de Forno</p>
                </div>

                <div class="errado" id="validacaoErrada">
                    <span class="iconeValidacao" aria-hidden="true">✕</span>
                    <p>Ingredientes (X/X)</p>
                    <p>Tempo de Forno</p>
                </div>
            </div>

            <div class="botoes">
                <a href="montagem.html" class="retry" id="tentarNovamente">TENTAR DE NOVO</a>
                <a href="fornos.html" class="continue" id="assaarPizza">ASSAR MESMO ASSIM</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
